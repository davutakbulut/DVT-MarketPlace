<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dvtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7855" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#D83A14" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF5722" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#dvtGrad)" filter="url(#shadow)" />
  <rect x="40" y="40" width="432" height="432" rx="120" fill="none" stroke="url(#glowGrad)" stroke-width="6" />

  <!-- Geometric Upward Financial Chart Lines -->
  <path d="M120 360 L200 270 L280 310 L392 160" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Arrow Head -->
  <path d="M320 160 L392 160 L392 232" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pulse Dots on Key Vertices -->
  <circle cx="120" cy="360" r="18" fill="#FFFFFF" />
  <circle cx="200" cy="270" r="18" fill="#FFFFFF" />
  <circle cx="280" cy="310" r="18" fill="#FFFFFF" />
  <circle cx="392" cy="160" r="22" fill="#FFFFFF" />
</svg>